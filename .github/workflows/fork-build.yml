name: Fork Build & Push

# Fork-only image build. Upstream's build.yml pushes to ghcr.io/carbogninalberto
# and only runs on published releases, so it can never produce an image for this
# fork. This workflow lives in a separate file so syncing upstream never
# conflicts, and no-ops if it ever ends up in the upstream repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build All-in-One Image
    runs-on: ubuntu-latest
    if: github.repository_owner != 'carbogninalberto'

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          # Full history: the semver patch number is derived from the commit count.
          fetch-depth: 0

      - name: Resolve image name and version
        id: image
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"

          # ArgoCD Image Updater watches this image with updateStrategy: semver and
          # allowTags "regexp:^v0\.1\.[0-9]+$", so every build needs a tag of that exact
          # shape that sorts ABOVE the previous one or no rollout happens.
          #
          # The patch number is the commit count on this branch. It is monotonic, needs
          # no state outside git, and sits far above upstream's v0.1.x line, so a fork
          # build always wins the semver comparison even right after merging an upstream
          # release. Do not rewrite this branch's history — a shrinking count would stall
          # the updater, which never moves backwards.
          {
            echo "name=ghcr.io/$owner/kuayle"
            echo "sha=sha-$(git rev-parse --short HEAD)"
            echo "semver=v0.1.$(git rev-list --count HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push all-in-one
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.semver }}
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.semver }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fork-all-in-one
          cache-to: type=gha,mode=max,scope=fork-all-in-one

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${{ steps.image.outputs.name }}:${{ steps.image.outputs.semver }}"
            echo "${{ steps.image.outputs.name }}:latest"
            echo "${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}"
            echo '```'
            echo
            echo "ArgoCD Image Updater tracks the \`${{ steps.image.outputs.semver }}\` tag."
          } >> "$GITHUB_STEP_SUMMARY"
