name: Fork Build & Push

# Fork-only image build. Upstream's build.yml pushes to ghcr.io/carbogninalberto
# and only runs on published releases, so it can never produce an image for this
# fork. This workflow lives in a separate file so syncing upstream never
# conflicts, and no-ops if it ever ends up in the upstream repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build All-in-One Image
    runs-on: ubuntu-latest
    if: github.repository_owner != 'carbogninalberto'

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Resolve image name
        id: image
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$owner/kuayle" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push all-in-one
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fork-all-in-one
          cache-to: type=gha,mode=max,scope=fork-all-in-one

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}"
            echo "${{ steps.image.outputs.name }}:latest"
            echo '```'
            echo
            echo "Pin the \`sha-\` tag in your deployment so rollouts are immutable."
          } >> "$GITHUB_STEP_SUMMARY"
